[e0_training]
model = "torchvision ResNet-50 with 5-output classifier"
pretrained = true
seed = 42
image_size = 384
epochs = 10
batch_size = 8
learning_rate = 0.0001
weight_decay = 0.0001
num_workers = 0
imbalance_strategy = "inverse-frequency weighted cross-entropy using training partition only"

[e0_development]
