[image_quality_assessment]
role = "Assess gradability and quality dimensions before diagnostic interpretation."
candidate_dimensions = ["clarity", "field_definition", "artifacts", "overall_gradability"]
method = "TODO: select and validate"
threshold_policy = "TODO: calibrate against annotated quality data"

[preprocessing]
role = "Apply deterministic retinal-field handling and baseline model-input preparation after input validation."
baseline = "RGB conversion, conservative intensity-based retinal-field crop with fallback, antialiased resize to 384x384, tensor conversion, ImageNet normalization"
retinal_field_crop = "Enabled baseline; conservative threshold/padding requires validation."
illumination_normalization = "Optional deterministic bounded global exposure adjustment; disabled by default; requires ablation."
clahe = "Extension point only; disabled. Requires ablation because it can alter lesion appearance and XAI evidence."
quality_guided_policy = "EXPERIMENT: define only after quality-study ablation"
future_quality_assessment_integration = "TODO: quality metadata and IQA-guided decisions are not part of the Dataset API yet."

[retinal_encoder]
role = "Produce a domain-robust retinal representation for downstream tasks."
backbone = "TODO: choose after benchmark and resource evaluation"
initialization = "TODO: compare appropriate pretrained representations"

[lesion_branch]
role = "Produce lesion-localized evidence for explainability and grading interaction."
supervision = "TODO: determine availability and suitability of lesion annotations"
lesion_taxonomy = "TODO: define only from supported labels"

[anatomical_structure_branch]
role = "Optionally model clinically justified retinal structures or landmarks."
